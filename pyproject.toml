[project]
name = "agentic-system-lab"
version = "0.1.0"
description = "Small customer-support agent orchestrator prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "openai>=1.99.0",
  "pydantic>=2.6",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
