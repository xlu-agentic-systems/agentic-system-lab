[project]
name = "agentic-system-lab"
version = "0.1.0"
description = "Agentic system lab projects"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "openai>=1.99.0",
  "pydantic>=2.6",
  "pypdf>=4.0",
  "python-multipart>=0.0.9",
  "starlette<1.0",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
  "tests",
  "benchmarks/tests",
  "project1_multi_agent_return_bot/tests",
  "project2_agent_orchestrator/tests",
  "project3_adaptive_eval_system/tests",
  "project3_adaptive_eval_system/generated_tests",
  "project4_agentic_project_copilot/tests",
]
pythonpath = ["."]
