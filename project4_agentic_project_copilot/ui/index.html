<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic Project Copilot</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #64748b;
      --border: #d7dde5;
      --accent: #2563eb;
      --soft: #e8f0ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      min-height: 100vh;
      padding: 16px;
    }
    .chat, aside {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-width: 0;
    }
    .chat {
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }
    header, aside header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 650;
    }
    #messages {
      padding: 16px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 820px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .user { align-self: flex-end; background: var(--soft); }
    .assistant { align-self: flex-start; background: #fff; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    input[type="text"] {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 15px;
    }
    button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      border-radius: 6px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 600;
    }
    aside { padding-bottom: 12px; }
    aside section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; }
    pre {
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 10px;
      overflow: auto;
      font-size: 12px;
    }
    .small { color: var(--muted); font-size: 13px; }
    .state-line {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.4;
      margin: 8px 0 0;
      overflow-wrap: anywhere;
    }
    .citation {
      border-left: 3px solid var(--accent);
      padding-left: 8px;
      margin: 6px 0;
      font-size: 13px;
    }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <section class="chat">
      <header>Agentic Project Copilot</header>
      <div id="messages"></div>
      <form id="chat-form">
        <input id="message" type="text" autocomplete="off" placeholder="Ask about files, tasks, or actions">
        <button type="submit">Send</button>
      </form>
    </section>
    <aside>
      <header>Runtime State</header>
      <section>
        <h2>Upload</h2>
        <input id="file" type="file" accept=".md,.markdown,.txt,.text,.rst,.pdf">
        <button id="upload" type="button">Upload</button>
        <p id="upload-status" class="small"></p>
        <p id="selected-document" class="state-line">No file selected.</p>
      </section>
      <section>
        <h2>Context</h2>
        <pre id="context">{
  "current_project_id": null,
  "current_task_id": null,
  "current_document": null
}</pre>
      </section>
      <section>
        <h2>SQL</h2>
        <pre id="sql">No SQL yet.</pre>
      </section>
      <section>
        <h2>Tool Call</h2>
        <pre id="tool">No tool call yet.</pre>
        <h2>Tool Result</h2>
        <pre id="tool-result">No tool result yet.</pre>
        <button id="confirm" type="button" style="display:none">Confirm Action</button>
      </section>
      <section>
        <h2>Citations</h2>
        <div id="citations" class="small">No citations yet.</div>
      </section>
    </aside>
  </main>
  <script>
    const sessionId = localStorage.getItem("copilotSessionId") || crypto.randomUUID();
    localStorage.setItem("copilotSessionId", sessionId);
    let pendingActionId = null;

    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const context = document.getElementById("context");
    const sql = document.getElementById("sql");
    const tool = document.getElementById("tool");
    const toolResult = document.getElementById("tool-result");
    const citations = document.getElementById("citations");
    const confirmButton = document.getElementById("confirm");
    const uploadButton = document.getElementById("upload");
    const selectedDocument = document.getElementById("selected-document");

    function addMessage(role, text) {
      const item = document.createElement("div");
      item.className = `msg ${role}`;
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    function currentContext() {
      try {
        return JSON.parse(context.textContent);
      } catch (error) {
        return {};
      }
    }

    function renderContext(rawContext = {}) {
      const currentDocumentId = rawContext.current_document_id || null;
      const currentDocumentFilename = rawContext.current_document_filename || null;
      selectedDocument.textContent = currentDocumentFilename
        ? `Current file: ${currentDocumentFilename}`
        : currentDocumentId ? "Current file selected." : "No file selected.";
      context.textContent = JSON.stringify({
        current_project_id: rawContext.current_project_id || null,
        current_task_id: rawContext.current_task_id || null,
        current_document: currentDocumentId ? {
          id: currentDocumentId,
          filename: currentDocumentFilename
        } : null
      }, null, 2);
    }

    async function readError(response) {
      try {
        const data = await response.json();
        return data.detail || data.error || JSON.stringify(data);
      } catch (error) {
        return await response.text();
      }
    }

    async function send(message, confirmActionId = null) {
      const body = { session_id: sessionId, message };
      if (confirmActionId) body.confirm_action_id = confirmActionId;
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!response.ok) {
          throw new Error(await readError(response) || `${response.status} ${response.statusText}`);
        }
        const data = await response.json();
        addMessage("assistant", data.response);
        renderContext(data.context);
        sql.textContent = data.generated_sql || "No SQL for this turn.";
        tool.textContent = data.tool_call ? JSON.stringify(data.tool_call, null, 2) : "No tool call for this turn.";
        toolResult.textContent = data.tool_result ? JSON.stringify(data.tool_result, null, 2) : "No tool result for this turn.";
        pendingActionId = data.pending_action ? data.pending_action.action_id : null;
        confirmButton.style.display = pendingActionId ? "block" : "none";
        citations.textContent = "";
        if (data.citations.length) {
          data.citations.forEach((citation) => {
            const item = document.createElement("div");
            item.className = "citation";
            const title = document.createElement("strong");
            title.textContent = citation.filename;
            const quote = document.createElement("div");
            quote.textContent = citation.quote;
            item.appendChild(title);
            item.appendChild(quote);
            citations.appendChild(item);
          });
        } else {
          citations.textContent = "No citations for this turn.";
        }
      } catch (error) {
        addMessage("assistant", `Request failed: ${error.message}`);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addMessage("user", text);
      await send(text);
    });

    confirmButton.addEventListener("click", async () => {
      if (!pendingActionId) return;
      addMessage("user", "Confirm action");
      await send("Confirm action", pendingActionId);
    });

    uploadButton.addEventListener("click", async () => {
      const file = document.getElementById("file").files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append("file", file);
      formData.append("session_id", sessionId);
      uploadButton.disabled = true;
      uploadButton.textContent = "Uploading...";
      try {
        const response = await fetch("/upload", { method: "POST", body: formData });
        if (!response.ok) {
          throw new Error(await readError(response) || `${response.status} ${response.statusText}`);
        }
        const data = await response.json();
        const existingContext = currentContext();
        const uploadContext = data.context || {
          current_project_id: existingContext.current_project_id || null,
          current_task_id: existingContext.current_task_id || null,
          current_document_id: data.document_id,
          current_document_filename: data.filename
        };
        document.getElementById("upload-status").textContent = `Uploaded ${data.filename} (${data.chunk_count} chunks)`;
        renderContext(uploadContext);
        addMessage("assistant", `Uploaded ${data.filename} (${data.chunk_count} chunks). It is now the current file.`);
      } catch (error) {
        document.getElementById("upload-status").textContent = `Upload failed: ${error.message}`;
      } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "Upload";
      }
    });

    addMessage("assistant", "Ask about uploaded docs, query tasks, or request task actions. Writes require confirmation.");
  </script>
</body>
</html>
